<div class="ip-root s1-root" style="padding:0; min-height:1024px"><main class="ip-login-page"><section class="ip-panel ip-login" aria-labelledby="s1-h"><h1 class="ip-wordmark ip-wordmark--login" id="s1-h">Impex Line</h1><form class="ip-login__form" method="post" action="/intra" novalidate aria-labelledby="s1-h"><div class="ip-field"><label class="ip-label" for="s1-login">Login</label><div class="ip-input is-focus"><input id="s1-login" name="login" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="40" required></div></div><div class="ip-field"><label class="ip-label" for="s1-pw">Parolă</label><div class="ip-input ip-login__pw"><input id="s1-pw" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required><button type="button" class="ip-iconbtn ip-login__eye" aria-label="Arată parola" aria-pressed="false" aria-controls="s1-pw"><svg class="ip-icon ip-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><button type="submit" class="ip-btn ip-btn--primary ip-login__go">Intră</button><p class="ip-hint ip-login__hint">Ai uitat parola? Vorbește cu administratorul.</p><p class="ip-sr" role="status" aria-live="polite"></p></form></section></main></div>
</x-dc>
